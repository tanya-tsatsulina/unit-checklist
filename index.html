<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1a22" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>Чек-лист квартиры</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
  <link rel="stylesheet" href="styles.css">
  <script src="inventory.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1 id="title">Чек-лист квартиры</h1>
      <button id="lang" class="pill" type="button" aria-label="Language">EN</button>
    </div>
    <select id="apt" class="apt" aria-label="Apartment" hidden></select>
    <div class="progress" aria-live="polite">
      <span id="mood" class="mood">😬</span>
      <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
      <span id="count" class="count">0 / 0</span>
    </div>
    <p id="hint" class="hint"></p>
  </header>

  <main id="grid" class="grid"></main>

  <footer class="bottom">
    <button id="reset" class="btn ghost" type="button"></button>
    <button id="finish" class="btn primary" type="button"></button>
  </footer>

  <div id="toast" class="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button id="toast-undo" class="toast-undo" type="button"></button>
  </div>

  <dialog id="result" class="result">
    <div class="result-emoji" id="result-emoji"></div>
    <h2 id="result-title"></h2>
    <p id="result-text"></p>
    <ul id="result-list" class="result-list"></ul>
    <form method="dialog"><button class="btn primary wide" id="result-close"></button></form>
  </dialog>
</body>
</html>
